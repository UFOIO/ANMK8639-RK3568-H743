# ===== 日志 =====
log:
  level: INFO          # DEBUG | INFO | WARNING | ERROR
  format: "text"        # text | json  (json适合ELK/Loki日志系统)
  dir: ./data/logs
  max_days: 30

# ===== MQTT 地面站 =====
mqtt:
  # --- 连接本机 Mosquitto Broker (配合 Tailscale 实现全国通信) ---
  enabled: false                        # 部署 Mosquitto 后改为 true
  broker: "127.0.0.1"                   # 本机 Mosquitto
  port: 1883
  client_id: "hangar_001"
  username: "hangar"                    # mosquitto_passwd 创建的用户
  password: "请填写mosquitto密码"
  keepalive: 30            # 心跳间隔(秒)
  status_interval: 5       # 状态上报间隔(秒)
  topic_prefix: "hangar/"  # MQTT主题前缀
  qos: 1                   # 默认QoS: 遥测=0, 状态=1, 告警=2
  reconnect_min: 2         # 重连最小间隔(秒)
  reconnect_max: 60        # 重连最大间隔(秒)

# ===== MAVLink 无人机 =====
mavlink:
  # --- 连接方式: tcp (4G图传) 或 serial (USB直连飞控) ---
  connection: "tcp"
  host: "请填写4G模块IP"
  port: 5760
  device: "/dev/ttyACM0"
  baudrate: 115200
  telem_rate: 4            # 遥测刷新率(Hz)，1-10，默认4
  heartbeat_timeout: 5     # 心跳超时(秒)
  system_id: 255           # MAVLink系统ID
  reconnect_interval: 3    # 重连间隔(秒)

# ===== STM32 串口 =====
stm32:
  # 串口设备: 默认/dev/ttyUSB0，避免与MAVLink冲突
  port: "/dev/ttyUSB0"
  baudrate: 115200
  data_bits: 8
  parity: "N"              # N|E|O
  stop_bits: 1
  cmd_timeout: 0.5         # 指令超时(秒)
  cmd_retry: 3             # 重试次数
  status_interval: 1       # 主动上报间隔(秒)

# ===== 摄像头 RTSP =====

# ===== 摄像头 RTSP + go2rtc 流媒体代理 =====
camera:
  enabled: true
  # --- RTSP 源 (方式1: 直接URL, 方式2: 结构化字段拼接) ---
  rtsp_url: "rtsp://10.6.3.110:554/user=admin&password=&channel=1&stream=0.sdp?"
  # 以下结构字段在 rtsp_url 为空时使用
  ip: "10.6.3.110"
  port: 554
  username: "admin"
  password: ""
  channel: 1
  stream: 0                # 0=主码流 1=子码流
  # --- go2rtc 流媒体代理 ---
  go2rtc_enabled: true     # 启用 go2rtc (提供 MJPEG/MSE/WebRTC)
  go2rtc_port: 1984        # go2rtc API 和流媒体端口
  go2rtc_bin: "/usr/local/bin/go2rtc"
  # --- 抓图参数 ---
  snapshot_interval: 30    # 自动抓图间隔(秒), 0=禁用
  snapshot_dir: "./data/snapshots"
  snapshot_timeout: 10     # ffmpeg超时(秒)

safety:
  # --- 机库坐标（必填，否则保护逻辑不触发） ---
  hangar_lat: 0.0             # 机库纬度
  hangar_lon: 0.0             # 机库经度
  # --- 断联保护参数 ---
  lost_grace_period: 8        # 宽限期(秒)：短时波动不触发
  default_rtl_speed: 8.0      # 默认RTL速度(m/s)：地速=0时兜底
  door_eta_margin: 15         # 提前开舱(秒)：ETA前N秒开舱
  # --- 闭环保护参数 ---
  door_open_timeout: 300      # 开舱后超时(秒)：无人机未到则自动关舱，默认5分钟
  min_alt_for_protection: 5.0 # 最低保护高度(m)：低于此值认为在地面，不触发开舱
  min_battery_for_auto_open: 5  # 最低电量(%)：低于此值不开舱（大概率回不来）

# ===== 决策引擎 =====
decision:
  auto_open_on_rtl: true
  low_battery_threshold: 20      # 低电量阈值(%)
  lost_timeout: 30               # 失联超时(秒)
  rtl_alt_threshold: 100         # RTL高度阈值(m)
  door_open_delay: 5             # 开门延迟(秒)

# ===== 看门狗 =====
watchdog:
  enabled: true
  device: "/dev/watchdog"
  feed_interval: 30              # 喂狗间隔(秒)

# ===== 认证 =====
auth:
  enabled: false                    # 是否开启登录认证
  username: "admin"                 # 默认用户名
  password: "admin123"              # 默认密码（首次登录后建议修改）
  session_timeout_min: 30           # 会话超时(分钟)，关闭浏览器后超时需重登

# ===== VPN / Tailscale =====
vpn:
  tailscale_auth_key: ""           # Tailscale Auth Key (客户在 tailscale.com 后台生成)

# ===== Web 管理看板 =====
web_ui:
  host: "0.0.0.0"
  port: 8080
  api_key: ""                   # Web认证密钥(留空=无需认证)
  health_refresh: 3              # 健康检查刷新间隔(秒)
  alert_history: 100             # 告警历史条数

# ===== 升级管理 =====
upgrade:
  block_size: 1024               # IAP传输块大小
  block_timeout: 3.0             # 块超时(秒)
  auto_verify: true              # 升级后自动校验
