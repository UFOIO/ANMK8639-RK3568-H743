# ===== 日志 =====
log:
  level: INFO
  dir: ./data/logs
  max_days: 30

# ===== MQTT =====
mqtt:
  broker: "请填写Broker地址"
  port: 1883
  client_id: "hangar_001"
  username: "admin"
  password: "请填写密码"
  keepalive: 30
  status_interval: 5

# ===== MAVLink (无人机) =====
mavlink:
  host: "请填写4G模块IP"
  port: 5760
  heartbeat_timeout: 5
  system_id: 255

# ===== STM32 串口 =====
stm32:
  port: "/dev/ttyACM0"
  baudrate: 115200
  cmd_timeout: 0.5
  cmd_retry: 3

# ===== 摄像头 =====
camera:
  enabled: true
  rtsp_url: "rtsp://10.6.3.57:554/user=admin&password=&channel=1&stream=0.sdp?"
  snapshot_interval: 30
  snapshot_dir: "./data/snapshots"

# ===== 决策 =====
decision:
  auto_open_on_rtl: true
  low_battery_threshold: 20
  lost_timeout: 30

# ===== 看门狗 =====
watchdog:
  enabled: true
  device: "/dev/watchdog"
  feed_interval: 30

# ===== Web 管理看板 =====
web_ui:
  host: "0.0.0.0"
  port: 8080
