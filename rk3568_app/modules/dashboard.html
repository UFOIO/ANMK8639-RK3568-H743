<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANMK8639 机库控制系统</title>
<style>
:root{--bg:#0a0e14;--panel:#131820;--border:#1e2836;--blue:#39bae6;--green:#7fd962;--yellow:#ffb454;--red:#f26d78;--orange:#ff8f40;--dim:#5c6773;--text:#bfc7d0;--white:#e6eaf0;--radius:6px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5;min-height:100vh}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--panel);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100}
#topbar .title{display:flex;align-items:center;gap:12px}
#topbar .title h1{font-size:16px;font-weight:700;color:var(--white);letter-spacing:0.5px}
#topbar .title .ver{font-size:11px;color:var(--dim);background:var(--border);padding:2px 8px;border-radius:10px}
.hb-dot{width:10px;height:10px;border-radius:50%;display:inline-block;animation:pulse 1.5s ease-in-out infinite}
.hb-dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.hb-dot.warn{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.hb-dot.bad{background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 0.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
#uptime-display{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
nav{display:flex;gap:2px;background:var(--bg);border-radius:var(--radius);padding:2px}
nav button{padding:8px 18px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:13px;border-radius:var(--radius);transition:all 0.2s;font-family:var(--font)}
nav button:hover{color:var(--text);background:var(--border)}
nav button.active{background:var(--blue);color:#000;font-weight:600}
main{max-width:1300px;margin:0 auto;padding:16px 20px}
.tab{display:none}
.tab.active{display:block}

/* 连接状态卡片 */
.conn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.conn-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;transition:border-color 0.3s}
.conn-card:hover{border-color:var(--dim)}
.conn-card .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.conn-card .dot.healthy{background:var(--green);box-shadow:0 0 6px var(--green)}
.conn-card .dot.stale{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.conn-card .dot.dead{background:var(--red);box-shadow:0 0 6px var(--red)}
.conn-card .cinfo{flex:1}
.conn-card .cname{font-weight:600;color:var(--white);font-size:14px}
.conn-card .cstate{font-size:12px}
.conn-card .cstate.healthy{color:var(--green)}
.conn-card .cstate.stale{color:var(--yellow)}
.conn-card .cstate.dead{color:var(--red)}
.conn-card .cage{font-size:11px;color:var(--dim);margin-top:2px}

/* 面板 */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel h2{font-size:14px;font-weight:600;color:var(--white);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.panel h2 .icon{font-size:16px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.info-item{background:var(--bg);border-radius:var(--radius);padding:10px 12px}
.info-item .il{font-size:11px;color:var(--dim);margin-bottom:4px}
.info-item .iv{font-size:16px;font-weight:600;color:var(--white);font-variant-numeric:tabular-nums}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid-2{grid-template-columns:1fr}}

/* 系统资源条 */
.bar-row{margin-bottom:10px}
.bar-label{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px;color:var(--dim)}
.bar-label span:last-child{color:var(--text);font-weight:500}
.bar-track{background:var(--bg);border-radius:10px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:10px;transition:width 0.5s ease}
.bar-fill.cpu{background:var(--blue)}
.bar-fill.ram{background:var(--green)}
.bar-fill.disk{background:var(--orange)}
#sys-detail{font-size:11px;color:var(--dim);margin-top:10px;text-align:center}

/* 事件日志 */
.event-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03);align-items:baseline;font-size:12px}
.event-row .elv{padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;flex-shrink:0;min-width:32px;text-align:center}
.event-row .elv.info{background:var(--blue);color:#000}
.event-row .elv.warn{background:var(--yellow);color:#000}
.event-row .elv.error{background:var(--red);color:#fff}
.event-row .ets{color:var(--dim);flex-shrink:0;min-width:60px;font-variant-numeric:tabular-nums}
.event-row .esrc{color:var(--blue);flex-shrink:0;min-width:60px}
.event-row .emsg{color:var(--text);word-break:break-all}
.event-filters{display:flex;gap:6px;margin-bottom:10px}
.event-filters button{padding:4px 12px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;border-radius:var(--radius);font-size:11px;font-family:var(--font)}
.event-filters button:hover{color:var(--text);border-color:var(--dim)}
.event-filters button.on{background:var(--blue);color:#000;border-color:var(--blue)}

/* 配置表单 */
.cfg-section{margin-bottom:16px}
.cfg-section h3{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:10px;padding-left:8px;border-left:3px solid var(--blue)}
.cfg-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cfg-row label{min-width:150px;text-align:right;color:var(--dim);font-size:12px}
.cfg-row input,.cfg-row select{flex:1;max-width:300px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);font-size:12px;font-family:var(--font)}
.cfg-row input:focus,.cfg-row select:focus{outline:none;border-color:var(--blue)}
.cfg-row input[type=checkbox]{flex:none;width:16px;height:16px;accent-color:var(--blue)}

/* 按钮 */
.btn{padding:8px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font);transition:all 0.15s}
.btn-blue{background:var(--blue);color:#000}.btn-sm{padding:4px 10px;font-size:11px}
.btn-blue:hover{opacity:0.85}
.btn-green{background:var(--green);color:#000}
.btn-green:hover{opacity:0.85}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{opacity:0.85}
.btn-outline{border:1px solid var(--border);background:transparent;color:var(--text)}
.btn-outline:hover{background:var(--border)}
.cmd-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#cmd-result{margin-top:8px;font-size:12px}

/* Toast */
#toast-container{position:fixed;top:60px;right:20px;z-index:200;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:var(--radius);font-size:12px;font-weight:500;animation:slideIn 0.3s ease;display:flex;align-items:center;gap:10px;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.toast.info{background:#1a3a4a;border:1px solid var(--blue);color:var(--blue)}
.toast.warn{background:#3a2a1a;border:1px solid var(--yellow);color:var(--yellow)}
.toast.error{background:#3a1a1a;border:1px solid var(--red);color:var(--red)}
.toast .tclose{cursor:pointer;font-size:16px;opacity:0.6;margin-left:auto}
.toast .tclose:hover{opacity:1}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}

/* 日志 */
#logs-content{background:var(--bg);color:var(--text);padding:12px;border-radius:var(--radius);font-family:"Cascadia Code",Consolas,monospace;font-size:11px;white-space:pre-wrap;max-height:500px;overflow-y:auto;line-height:1.6}

/* 登录 */
.login-box{max-width:380px;margin:80px auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px;text-align:center}
.login-box h1{color:var(--white);margin-bottom:20px}
.login-box input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);margin-bottom:12px;font-size:14px;text-align:center}
.login-box input:focus{outline:none;border-color:var(--blue)}

.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.badge.green{background:var(--green);color:#000}
.badge.red{background:var(--red);color:#fff}
.badge.yellow{background:var(--yellow);color:#000}
</style>
</head>
<body>
<div id="topbar">
  <div class="title">
    <h1>ANMK8639 机库控制</h1>
    <span class="ver">v1.0</span>
    <span id="hb-dot" class="hb-dot bad"></span>
    <span id="uptime-display">运行 --</span>
  </div>
  <nav>
    <button class="active" onclick="switchTab('overview',this)">[总览]</button>
    <button onclick="switchTab('config',this)">[配置]</button>
    <button onclick="switchTab('control',this)">[控制]</button>
    <button onclick="switchTab('logs',this)">[日志]</button>
  </nav>
</div>

<main>
<!-- ====== 总览 ====== -->
<div class="tab active" id="tab-overview">
  <div class="conn-grid" id="conn-cards"></div>
  <div class="grid-2">
    <div class="panel"><h2>>> 无人机遥测</h2><div class="info-grid" id="drone-grid"></div>
    <div id="protection-panel" style="display:none;margin-top:12px;padding:10px;border-radius:6px;border:1px solid;font-size:13px"></div></div>
    <div class="panel"><h2>>> 机库状态</h2><div class="info-grid" id="hangar-grid"></div></div>
  </div>
  <div class="panel">
    <h2>>> 系统资源</h2>
    <div class="bar-row"><div class="bar-label"><span>CPU</span><span id="sys-cpu-v">--</span></div><div class="bar-track"><div class="bar-fill cpu" id="sys-cpu" style="width:0%"></div></div></div>
    <div class="bar-row"><div class="bar-label"><span>内存</span><span id="sys-ram-v">--</span></div><div class="bar-track"><div class="bar-fill ram" id="sys-ram" style="width:0%"></div></div></div>
    <div class="bar-row"><div class="bar-label"><span>磁盘</span><span id="sys-disk-v">--</span></div><div class="bar-track"><div class="bar-fill disk" id="sys-disk" style="width:0%"></div></div></div>
    <div id="sys-detail">--</div>
  </div>
  <div class="panel">
    <h2>>> 最近事件</h2>
    <div id="overview-events"><span style="color:var(--dim)">暂无事件</span></div>
  </div>
</div>

<!-- ====== 配置 ====== -->
<div class="tab" id="tab-config">
  <div class="panel">
    <h2>>> 系统配置 <button class="btn btn-blue" style="margin-left:auto" onclick="saveConfig()">[保存配置]</button> <span id="cfg-save-status"></span></h2>
    <div class="cfg-section"><h3>MQTT 地面站 <button class="btn btn-blue btn-sm" onclick="saveSection('mqtt')">[保存]</button> <span id="cfg-save-mqtt"></span></h3>
      <div class="cfg-row"><label>启用</label><input type="checkbox" id="cfg-mqtt-enabled"></div>
      <div class="cfg-row"><label>Broker 地址</label><input id="cfg-mqtt-broker" placeholder="mqtt.example.com"></div>
      <div class="cfg-row"><label>端口</label><input id="cfg-mqtt-port" type="number" placeholder="1883"></div>
      <div class="cfg-row"><label>用户名</label><input id="cfg-mqtt-username" placeholder="admin"></div>
      <div class="cfg-row"><label>密码</label><input id="cfg-mqtt-password" type="password" placeholder="密码"></div>
      <div class="cfg-row"><label>Topic 前缀</label><input id="cfg-mqtt-topic_prefix" placeholder="hangar/"></div>
    </div>
    <div class="cfg-section"><h3>MAVLink 无人机 <button class="btn btn-blue btn-sm" onclick="saveSection('mavlink')">[保存]</button> <button class="btn btn-outline btn-sm" onclick="scanSerialPorts()" style="margin-left:4px">[刷新设备]</button> <span id="cfg-save-mavlink"></span></h3>
      <div class="cfg-row"><label>连接方式</label><select id="cfg-mavlink-connection" onchange="onMavConnChange()"><option value="tcp">TCP (4G图传)</option><option value="serial">串口 (USB直连)</option></select></div>
      <div id="mav-tcp-fields">
        <div class="cfg-row"><label>4G模块IP</label><input id="cfg-mavlink-host" placeholder="192.168.x.x"></div>
        <div class="cfg-row"><label>端口</label><input id="cfg-mavlink-port" type="number" placeholder="5760"></div>
      </div>
      <div id="mav-serial-fields" style="display:none">
        <div class="cfg-row"><label>串口设备</label><select id="cfg-mavlink-device"><option value="/dev/ttyACM0">/dev/ttyACM0</option><option value="/dev/ttyACM1">/dev/ttyACM1</option><option value="/dev/ttyUSB0">/dev/ttyUSB0</option><option value="/dev/ttyUSB1">/dev/ttyUSB1</option></select></div>
        <div class="cfg-row"><label>波特率</label><input id="cfg-mavlink-baudrate" type="number" placeholder="115200"></div>
      </div>
      <div class="cfg-row"><label>心跳超时(秒)</label><input id="cfg-mavlink-hb_timeout" type="number" placeholder="5"></div>
      <div class="cfg-row"><label>遥测刷新率(Hz)</label><select id="cfg-mavlink-telem_rate"><option value="1">1 Hz</option><option value="2">2 Hz</option><option value="3">3 Hz</option><option value="4" selected>4 Hz (默认)</option><option value="6">6 Hz</option><option value="8">8 Hz</option><option value="10">10 Hz</option></select></div>
    </div>
    <div class="cfg-section"><h3>摄像头 RTSP <button class="btn btn-blue btn-sm" onclick="saveSection('camera')">[保存]</button> <span id="cfg-save-camera"></span></h3>
      <div class="cfg-row"><label>IP 地址</label><input id="cfg-camera-ip" placeholder="10.6.3.57"></div>
      <div class="cfg-row"><label>端口</label><input id="cfg-camera-port" type="number" placeholder="554"></div>
      <div class="cfg-row"><label>用户名</label><input id="cfg-camera-username" placeholder="admin"></div>
      <div class="cfg-row"><label>密码</label><input id="cfg-camera-password" type="password" placeholder="密码"></div>
      <div class="cfg-row"><label>通道</label><input id="cfg-camera-channel" type="number" placeholder="1"></div>
      <div class="cfg-row"><label>RTSP URL (直接填写)</label><input id="cfg-camera-rtsp_url" placeholder="rtsp://... (留空则用上方字段拼接)"></div>
    </div>
    <div class="cfg-section"><h3>STM32 串口 <button class="btn btn-blue btn-sm" onclick="saveSection('stm32')">[保存]</button> <button class="btn btn-outline btn-sm" onclick="scanSerialPorts()" style="margin-left:4px">[刷新设备]</button> <span id="cfg-save-stm32"></span></h3>
      <div class="cfg-row"><label>串口设备</label>
        <select id="cfg-stm32-device" onchange="onStmDeviceChange()">
          <option value="/dev/ttyUSB0">/dev/ttyUSB0 (常用)</option>
          <option value="/dev/ttyUSB1">/dev/ttyUSB1</option>
          <option value="/dev/ttyACM0">/dev/ttyACM0 (MAVLink在用)</option>
          <option value="/dev/ttyACM1">/dev/ttyACM1</option>
          <option value="__other__">自定义路径...</option>
        </select>
        <input id="cfg-stm32-device-custom" placeholder="输入设备路径，如 /dev/ttyXXX" style="display:none;margin-top:4px">
      </div>
      <div class="cfg-row"><label>波特率</label><input id="cfg-stm32-baudrate" type="number" placeholder="115200"></div>
    </div>
    <div class="cfg-section"><h3>决策引擎 <button class="btn btn-blue btn-sm" onclick="saveSection('decision')">[保存]</button> <span id="cfg-save-decision"></span></h3>
      <div class="cfg-row"><label>RTL自动开门</label><input type="checkbox" id="cfg-decision-auto_open_on_rtl"></div>
      <div class="cfg-row"><label>低电量阈值(%)</label><input id="cfg-decision-low_battery_threshold" type="number" placeholder="20"></div>
      <div class="cfg-row"><label>失联超时(秒)</label><input id="cfg-decision-lost_timeout" type="number" placeholder="30"></div>
    </div>
  </div>
</div>

<!-- ====== 控制 ====== -->
<div class="tab" id="tab-control">
  <div class="panel"><h2>>> 舱门控制</h2>
    <div class="cmd-grid">
      <button class="btn btn-green" onclick="sendCmd('OPEN_DOOR')">开门</button>
      <button class="btn btn-red" onclick="sendCmd('CLOSE_DOOR')">关门</button>
      <button class="btn btn-outline" onclick="sendCmd('LOCK')">上锁</button>
      <button class="btn btn-outline" onclick="sendCmd('UNLOCK')">解锁</button>
    </div>
    <div id="cmd-result"></div>
  </div>
  <div class="panel"><h2>>> 系统操作</h2>
    <div class="cmd-grid">
      <button class="btn btn-blue" onclick="captureSnapshot()">[手动截图]</button>
      <button class="btn btn-red" onclick="restartService()">[重启服务]</button> <button class="btn btn-red" onclick="rebootDevice()">[重启终端]</button>
    </div>
  </div>
  <div class="panel"><h2>>> 决策规则</h2><div id="decision-rules" style="color:var(--dim)">从配置加载...</div></div>
</div>

<!-- ====== 日志 ====== -->
<div class="tab" id="tab-logs">
  <div class="panel">
    <h2>>> 事件日志</h2>
    <div class="event-filters">
      <button id="ef-all" class="on" onclick="filterEvents('all')">全部</button>
      <button id="ef-info" onclick="filterEvents('info')">信息</button>
      <button id="ef-warn" onclick="filterEvents('warn')">警告</button>
      <button id="ef-error" onclick="filterEvents('error')">错误</button>
    </div>
    <div id="events-list"><span style="color:var(--dim)">加载中...</span></div>
  </div>
  <div class="panel">
    <h2>>> 系统日志</h2>
    <div id="logs-content">加载中...</div>
  </div>
</div>
</main>

<div id="toast-container"></div>

<script>
// ====== 全局状态 ======
var APP = {uptime:0, overall:"unknown"};

// ====== 核心工具函数 ======
function h(tag, text, cls, parent) {
  var el = document.createElement(tag);
  if (text) el.textContent = text;
  if (cls) el.className = cls;
  if (parent) parent.appendChild(el);
  return el;
}

function showToast(msg, level) {
  var lv = level || "info";
  var c = document.getElementById("toast-container");
  if (!c) return;
  var t = h("div", "", "toast " + lv, c);
  h("span", msg, "tmsg", t);
  var x = h("span", "\u00d7", "tclose", t);
  x.onclick = function() { c.removeChild(t); };
  setTimeout(function() { if (t.parentNode) c.removeChild(t); }, 5000);
}

// ====== Tab 切换 ======
function switchTab(id, btn) {
  document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
  document.querySelectorAll("nav button").forEach(function(b) { b.classList.remove("active"); });
  var tab = document.getElementById("tab-" + id);
  if (tab) tab.classList.add("active");
  if (btn) btn.classList.add("active");
  // 切换到日志页时刷新
  if (id === "logs") { loadEvents(); loadLogs(); }
  if (id === "config") { loadConfig(); scanSerialPorts(); }
}

// ====== 健康轮询 (每秒) ======
function pollHealth(){fetch("/api/health").then(function(r){return r.json()}).then(function(d){APP=d;updateConnectionCards(d);updateOverview(d);updateSystemBars(d);updateRecentEvents(d);var u=Math.floor((d.uptime||0)/60),s=Math.floor((d.uptime||0)%60);document.getElementById("uptime-display").textContent="运行 "+u+"分"+s+"秒 | "+(d.overall||"?");var dot=document.getElementById("hb-dot");if(dot){dot.className="hb-dot "+(d.overall==="healthy"?"ok":d.overall==="degraded"?"warn":"bad")}}).catch(function(e){})};setTimeout(pollHealth,250)

// ====== 连接状态卡片 ======
var _MOD_NAMES = {mavlink:"MAVLink 无人机", mqtt:"MQTT 地面站", stm32:"STM32 下位机", camera:"摄像头"};
var _MOD_LABEL = {mavlink:{k:"last_hb_sec",label:"心跳"}, mqtt:{k:"last_msg_sec",label:"消息"}, stm32:{k:"last_status_sec",label:"状态上报"}, camera:{k:"last_snapshot_sec",label:"截图"}};

function updateConnectionCards(d) {
  var c = document.getElementById("conn-cards");
  if (!c) return;
  c.innerHTML = "";
  ["mavlink","mqtt","stm32","camera"].forEach(function(k) {
    var m = d[k] || {};
    var card = h("div", "", "conn-card", c);
    h("div", "", "dot " + (m.status || "dead"), card);
    var info = h("div", "", "cinfo", card);
    h("div", _MOD_NAMES[k] || k, "cname", info);
    var stateText = m.status === "healthy" ? "正常" : m.status === "stale" ? "延迟" : "离线";
    var stateEl = h("div", stateText, "cstate " + (m.status || "dead"), info);
    var age = m[_MOD_LABEL[k].k];
    var ageText = (age != null && age >= 0) ? Math.floor(age) + "秒" : "--";
    h("div", (_MOD_LABEL[k].label || "") + ": " + ageText, "cage", info);
  });
}

// ====== 遥测 + 机库状态 ======
function updateOverview(d) {
  var dg = document.getElementById("drone-grid");
  if (dg && d.drone) {
    dg.innerHTML = "";
    // Data freshness indicator
    if (d.drone.data_fresh === false && d.drone.connected === false && (d.mavlink && d.mavlink.last_hb_sec != null)) {
      dg.style.opacity = "0.45";
      dg.style.position = "relative";
      var staleBanner = document.getElementById("stale-banner");
      if (!staleBanner) {
        staleBanner = document.createElement("div");
        staleBanner.id = "stale-banner";
        staleBanner.style.cssText = "color:#f0883e;font-size:12px;padding:4px 8px;background:rgba(240,136,62,0.1);border:1px solid rgba(240,136,62,0.3);border-radius:4px;margin-bottom:8px;text-align:center";
        staleBanner.textContent = "⚠ 数据已过期，等待飞控重连...";
        dg.parentNode.insertBefore(staleBanner, dg);
      }
    } else {
      dg.style.opacity = "1";
      var sb = document.getElementById("stale-banner");
      if (sb) sb.remove();
    }
    addInfo(dg, "飞行模式", d.drone.mode || "--");
    addInfo(dg, "GPS卫星", d.drone.satellites != null ? d.drone.satellites : "--");
    addInfo(dg, "GPS定位", d.drone.gps_fix != null ? ["无","2D","3D","RTK"][d.drone.gps_fix]||"--" : "--");
    addInfo(dg, "高度(m)", d.drone.alt_rel != null ? d.drone.alt_rel : "--");
    addInfo(dg, "地速(m/s)", d.drone.groundspeed != null ? d.drone.groundspeed : "--");
    addInfo(dg, "航向(°)", d.drone.heading != null ? d.drone.heading : "--");
    addInfo(dg, "电量(%)", d.drone.battery != null ? d.drone.battery : "--");
    addInfo(dg, "电压(V)", d.drone.voltage != null ? d.drone.voltage : "--");
    addInfo(dg, "解锁状态", d.drone.armed ? "已解锁" : "未解锁");
    addInfo(dg, "纬度", d.drone.lat != null ? d.drone.lat.toFixed(6) : "--");
    addInfo(dg, "经度", d.drone.lon != null ? d.drone.lon.toFixed(6) : "--");
    addInfo(dg, "横滚(°)", d.drone.roll != null ? d.drone.roll : "--");
    addInfo(dg, "俯仰(°)", d.drone.pitch != null ? d.drone.pitch : "--");
    addInfo(dg, "当前航点", d.drone.wp_current != null ? d.drone.wp_current : "--");
  }
  // Protection status panel
  var pp = document.getElementById("protection-panel");
  if (pp && d.drone && d.drone.protection && d.drone.protection.active) {
    pp.style.display = "";
    var ps = d.drone.protection;
    var phaseText = {"countdown":"倒计时中，即将自动开舱...","door_open":"舱门已自动打开，等待无人机到达","resolved":"无人机已重连，保护结束","timeout_closed":"超时: 舱门已关闭+锁止"}[ps.phase] || "";
    var color = ps.phase === "timeout_closed" ? "#da3633" : ps.phase === "door_open" ? "#f0883e" : "#58a6ff";
    var bg = ps.phase === "timeout_closed" ? "rgba(218,54,51,0.1)" : ps.phase === "door_open" ? "rgba(240,136,62,0.1)" : "rgba(88,166,255,0.1)";
    pp.style.borderColor = color;
    pp.style.background = bg;
    pp.style.color = color;
    var html = "<b>⚠ 断联保护激活</b> | " + phaseText;
    if (ps.dist != null) html += "<br>距离机库: <b>" + ps.dist + "m</b>";
    if (ps.eta != null) html += " | ETA: <b>" + ps.eta + "s</b>";
    if (ps.open_at != null) html += " | 开舱倒计时: <b>" + ps.open_at + "s</b>";
    if (ps.timeout_remaining != null) html += " | 关舱倒计时: <b>" + Math.floor(ps.timeout_remaining) + "s</b>";
    if (ps.mode) html += "<br>模式: " + ps.mode;
    if (ps.batt != null) html += " | 电池: " + ps.batt + "%";
    if (ps.alt != null) html += " | 高度: " + ps.alt + "m";
    pp.innerHTML = html;
  } else if (pp) {
    pp.style.display = "none";
  }
  // Aborted protection
  if (pp && d.drone && d.drone.protection && d.drone.protection.aborted) {
    pp.style.display = "";
    pp.style.borderColor = "#8b949e";
    pp.style.background = "rgba(139,148,158,0.1)";
    pp.style.color = "#8b949e";
    pp.innerHTML = "<b>⚠ 断联保护已取消</b> | " + (d.drone.protection.reason || "");
  }
  var hg = document.getElementById("hangar-grid");
  if (hg && d.hangar) {
    hg.innerHTML = "";
    addInfo(hg, "舱门状态", d.hangar.door || "--");
    addInfo(hg, "锁状态", d.hangar.lock || "--");
    addInfo(hg, "温度(°C)", d.hangar.temp != null ? d.hangar.temp : "--");
    addInfo(hg, "湿度(%)", d.hangar.humidity != null ? d.hangar.humidity : "--");
    var alarms = d.hangar.alarm_flags;
    if (alarms != null) {
      addInfo(hg, "告警标志", "0x" + alarms.toString(16).toUpperCase());
    }
  }
}

function addInfo(parent, label, value) {
  var item = h("div", "", "info-item", parent);
  h("div", label, "il", item);
  h("div", String(value), "iv", item);
}

function updateSystemBars(d) {
  if (!d.system) return;
  var cpu = d.system.cpu || 0;
  var ramPct = d.system.ram_pct || 0;
  var diskPct = d.system.disk_pct || 0;
  var cpuEl = document.getElementById("sys-cpu");
  var ramEl = document.getElementById("sys-ram");
  var diskEl = document.getElementById("sys-disk");
  if (cpuEl) { cpuEl.style.width = Math.min(cpu, 100) + "%"; }
  if (ramEl) { ramEl.style.width = Math.min(ramPct, 100) + "%"; }
  if (diskEl) { diskEl.style.width = Math.min(diskPct, 100) + "%"; }
  var cv = document.getElementById("sys-cpu-v");
  if (cv) cv.textContent = "CPU " + Math.round(cpu) + "%";
  var rv = document.getElementById("sys-ram-v");
  if (rv) rv.textContent = "RAM " + Math.round(ramPct) + "%";
  var dv = document.getElementById("sys-disk-v");
  if (dv) dv.textContent = "磁盘 " + Math.round(diskPct) + "%";
  var det = document.getElementById("sys-detail");
  if (det) {
    det.textContent = "内存 " + (d.system.ram_used || "--") + " / " + (d.system.ram_total || "--") +
      " | 磁盘 " + (d.system.disk_used || "--") + " / " + (d.system.disk_total || "--");
  }
}

// ====== 最近事件 ======
function updateRecentEvents(d) {
  var evs = d.events || [];
  var el = document.getElementById("overview-events");
  if (!el) return;
  if (evs.length === 0) {
    el.innerHTML = '<span style="color:var(--dim)">暂无事件</span>';
    return;
  }
  var ht = "";
  for (var i = evs.length - 1; i >= Math.max(0, evs.length - 5); i--) {
    var e = evs[i];
    var dt = new Date((e.ts || 0) * 1000);
    var ts = dt.toTimeString().substring(0, 8);
    var levelCN = e.level === "info" ? "信息" : e.level === "warn" ? "警告" : "错误";
    ht += '<div class="event-row"><span class="elv ' + (e.level||"info") + '">' + levelCN +
      '</span><span class="ets">' + ts + '</span><span class="emsg">' + (e.message||"") + '</span></div>';
  }
  el.innerHTML = ht;
}

// ====== MAVLink 连接方式切换 ======
function onMavConnChange() {
  var v = document.getElementById("cfg-mavlink-connection");
  var tcp = document.getElementById("mav-tcp-fields");
  var ser = document.getElementById("mav-serial-fields");
  if (v && tcp && ser) {
    tcp.style.display = v.value === "serial" ? "none" : "";
    ser.style.display = v.value === "serial" ? "" : "none";
  }
}
function onStmDeviceChange() {
  var sel = document.getElementById("cfg-stm32-device");
  var custom = document.getElementById("cfg-stm32-device-custom");
  if (sel && custom) {
    custom.style.display = sel.value === "__other__" ? "" : "none";
  }
}
function _getStm32Port() {
  var sel = document.getElementById("cfg-stm32-device");
  if (!sel) return "/dev/ttyUSB0";
  if (sel.value === "__other__") {
    var cus = document.getElementById("cfg-stm32-device-custom");
    return (cus && cus.value) ? cus.value : "/dev/ttyUSB0";
  }
  return sel.value;
}
function _setStm32Device(port) {
  var sel = document.getElementById("cfg-stm32-device");
  var custom = document.getElementById("cfg-stm32-device-custom");
  if (!sel) return;
  var known = ["/dev/ttyUSB0","/dev/ttyUSB1","/dev/ttyACM0","/dev/ttyACM1"];
  if (known.indexOf(port) >= 0) {
    sel.value = port;
    if (custom) custom.style.display = "none";
  } else {
    sel.value = "__other__";
    if (custom) { custom.value = port || ""; custom.style.display = ""; }
  }
}

function scanSerialPorts() {
  fetch("/api/serial_ports")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var ports = d.ports || [];
      if (ports.length === 0) return;
      // Update MAVLink device dropdown
      var mavSel = document.getElementById("cfg-mavlink-device");
      if (mavSel) {
        var cur = mavSel.value;
        mavSel.innerHTML = "";
        ports.forEach(function(p) {
          var opt = document.createElement("option");
          opt.value = p.path;
          opt.textContent = p.label;
          mavSel.appendChild(opt);
        });
        mavSel.value = cur;
      }
      // Update STM32 device dropdown
      var stmSel = document.getElementById("cfg-stm32-device");
      if (stmSel) {
        var curStm = stmSel.value;
        // Keep custom option
        var hasCustom = false;
        for (var i = 0; i < stmSel.options.length; i++) {
          if (stmSel.options[i].value === "__other__") { hasCustom = true; break; }
        }
        stmSel.innerHTML = "";
        ports.forEach(function(p) {
          var opt = document.createElement("option");
          opt.value = p.path;
          opt.textContent = p.path;
          stmSel.appendChild(opt);
        });
        if (hasCustom) {
          var co = document.createElement("option");
          co.value = "__other__";
          co.textContent = "自定义路径...";
          stmSel.appendChild(co);
        }
        stmSel.value = curStm;
      }
    })
    .catch(function(e) {});
}

function setVal(id, val) {
  var el = document.getElementById(id);
  if (!el) return;
  if (el.type === "checkbox") el.checked = (val === true || val === "true");
  else el.value = val;
}

function gv(id, def, t) {
  var el = document.getElementById(id);
  if (!el) return def;
  if (t === "i") return parseInt(el.value) || def;
  if (t === "c") return el.type === "checkbox" ? el.checked : (el.value === "true");
  return el.value;
}

// ====== 事件日志 ======
var _evtFilter = "all";
function filterEvents(l) {
  _evtFilter = l;
  ["all","info","warn","error"].forEach(function(k) {
    var b = document.getElementById("ef-" + k);
    if (b) b.className = (k === l) ? "on" : "";
  });
  loadEvents();
}

function loadEvents() {
  fetch("/api/events?count=100")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var evs = d.events || [];
      var ht = "";
      for (var i = evs.length - 1; i >= 0; i--) {
        var e = evs[i];
        if (_evtFilter !== "all" && e.level !== _evtFilter) continue;
        var dt = new Date((e.ts || 0) * 1000);
        var ts = dt.toTimeString().substring(0, 8);
        var levelCN = e.level === "info" ? "信息" : e.level === "warn" ? "警告" : "错误";
        ht += '<div class="event-row"><span class="elv ' + (e.level||"info") + '">' + levelCN +
          '</span><span class="ets">' + ts + '</span><span class="esrc">' + (e.source||"") +
          '</span><span class="emsg">' + (e.message||"") + '</span></div>';
      }
      var el = document.getElementById("events-list");
      if (el) el.innerHTML = ht || '<div style="color:var(--dim);text-align:center;padding:20px">暂无事件</div>';
    })
    .catch(function() {});
}

function loadLogs() {
  fetch("/api/logs")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var el = document.getElementById("logs-content");

    })
    .catch(function() {
      var el = document.getElementById("logs-content");
      if (el) el.textContent = "(日志加载失败)";

}
