# Mosquitto MQTT Broker 配置 — ANMK8639 Hangar
# 安装路径: /etc/mosquitto/conf.d/hangar.conf

# 监听所有网口（本机 127.0.0.1 + Tailscale 虚拟网卡）
listener 1883 0.0.0.0

# 密码认证
password_file /etc/mosquitto/passwd
allow_anonymous false

# 持久化：重启 Mosquitto 不丢消息
persistence true
persistence_location /var/lib/mosquitto/

# 断联消息缓存队列（调度系统离线时暂存告警）
max_queued_messages 1000
max_inflight_messages 100
